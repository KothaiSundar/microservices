spring:
 application:
  name: "configserver"

 mvc:
  trailing-slash-match: true

 profiles:
  #active: native
  active: git

 cloud:
  config:
   server:
     git:
      uri: "https://github.com/KothaiSundar/eazybytes-config.git"
      default-label: master
      timeout: 5
      clone-on-start: true
      force-pull: true

  stream:
    bindings:
      springCloudBusInput:
        group: config-server-group


management:
  endpoints:
    web:
      exposure:
        include: "*"
  health:
    readiness-state:
      enabled: true
    liveness-state:
      enabled: true
  endpoint:
    health:
      probes:
        enabled: true
    

encrypt:
 key: "Kothaiias20*"

server:
 port: 8071
